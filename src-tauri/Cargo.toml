[package]
name = "orbwin"
version = "0.1.0"
edition = "2021"
description = "OrbWin desktop integration"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rfd = "0.17"
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "rt-multi-thread", "sync"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
