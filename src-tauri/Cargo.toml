[package]
name = "orbwin"
version = "0.1.0"
edition = "2021"
description = "OrbWin desktop integration"
rust-version = "1.92"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.11"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
rfd = "0.18"
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "rt-multi-thread", "sync", "net"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
