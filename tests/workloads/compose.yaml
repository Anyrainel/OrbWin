services:
  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    ports: ["127.0.0.1::6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 40
    volumes: ["redis-data:/data"]
  postgres:
    image: postgres:17.4-alpine@sha256:7062a2109c4b51f3c792c7ea01e83ed12ef9a980886e3b3d380a7d2e5f6ce3f5
    environment:
      POSTGRES_PASSWORD: disposable-qualification-only
      POSTGRES_DB: orbwin_test
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orbwin_test"]
      interval: 1s
      timeout: 3s
      retries: 60
    volumes: ["postgres-data:/var/lib/postgresql/data"]
volumes:
  redis-data: {}
  postgres-data: {}
